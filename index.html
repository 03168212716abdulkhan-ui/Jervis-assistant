<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JARVIS Assistant</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#020914;
  color:white;
  font-family:Arial,sans-serif;
}

.jarvis{
  width:92%;
  max-width:480px;
  text-align:center;
  padding:30px 20px;
  border-radius:25px;
  background:#071a2d;
  box-shadow:0 0 30px #008cff;
}

h1{
  color:#00aaff;
  font-size:42px;
  margin-top:0;
}

#s{
  min-height:55px;
  margin:20px 0;
  padding:15px;
  border-radius:15px;
  background:#0b263d;
  color:#8ed8ff;
  line-height:1.5;
}

button{
  border:0;
  padding:14px 22px;
  margin:5px;
  border-radius:30px;
  background:#008cff;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.95);
}

#chatBox{
  margin-top:20px;
  display:flex;
  gap:6px;
}

#chatInput{
  flex:1;
  min-width:0;
  padding:14px;
  border:0;
  border-radius:25px;
  outline:none;
  font-size:16px;
  background:#102f49;
  color:white;
}

#chatInput::placeholder{
  color:#9bb8ca;
}

#chatBox button{
  margin:0;
  padding:12px 16px;
}

</style>
</head>

<body>

<div class="jarvis">

<h1>🤖 JARVIS</h1>

<div id="s">
Ready. Speak or type a message.
</div>

<button onclick="talk()">🎙️ Speak</button>

<button onclick="stopJarvis()">⏹️ Stop</button>


<div id="chatBox">

<input
id="chatInput"
type="text"
placeholder="Type your message..."
>

<button onclick="sendChat()">💬 Chat</button>

</div>

</div>


<script>

const s = document.getElementById("s");

let recognition = null;


/* VOICE REPLY */

function speak(text){

  s.textContent = text;

  if("speechSynthesis" in window){

    speechSynthesis.cancel();

    const voice =
      new SpeechSynthesisUtterance(text);

    voice.lang = "en-US";
    voice.rate = 1;
    voice.pitch = 1;

    speechSynthesis.speak(voice);
  }
}


/* VOICE INPUT */

function talk(){

  const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SR){

    s.textContent =
      "Voice recognition is not supported. Please use Chrome.";

    return;
  }


  if(recognition){

    try{
      recognition.stop();
    }catch(e){}

  }


  recognition = new SR();

  recognition.lang = "en-US";

  recognition.interimResults = false;

  recognition.continuous = false;

  recognition.maxAlternatives = 1;


  s.textContent =
    "🎙️ Listening... Speak now.";


  recognition.onresult = function(event){

    const text =
      event.results[0][0].transcript
      .toLowerCase()
      .trim();


    s.textContent =
      "You: " + text;


    jarvisCommand(text);

  };


  recognition.onerror = function(event){

    if(event.error === "not-allowed"){

      s.textContent =
        "🎙️ Microphone permission is blocked.";

    }

    else if(event.error === "no-speech"){

      s.textContent =
        "🎙️ No speech detected. Try again.";

    }

    else{

      s.textContent =
        "Microphone error: " + event.error;

    }

  };


  try{

    recognition.start();

  }catch(error){

    s.textContent =
      "🎙️ Tap Speak again.";

  }

}


/* JARVIS COMMANDS */

function jarvisCommand(text){


  if(
    text.includes("hello") ||
    text.includes("hi") ||
    text.includes("hey")
  ){

    speak(
      "Hello. I am Jarvis. How can I help you?"
    );

  }


  else if(text.includes("time")){

    const time =
      new Date().toLocaleTimeString(
        [],
        {
          hour:"2-digit",
          minute:"2-digit"
        }
      );

    speak(
      "The time is " + time
    );

  }


  else if(text.includes("date")){

    speak(
      "Today's date is " +
      new Date().toLocaleDateString()
    );

  }


  else if(text.includes("youtube")){

    speak("Opening YouTube.");

    setTimeout(function(){

      window.location.href =
        "https://www.youtube.com/";

    },1000);

  }


  else if(text.includes("google")){

    speak("Opening Google.");

    setTimeout(function(){

      window.location.href =
        "https://www.google.com/";

    },1000);

  }


  else if(text.startsWith("search")){

    const query =
      text.replace("search","").trim();


    if(query){

      speak(
        "Searching for " + query
      );


      setTimeout(function(){

        window.location.href =
          "https://www.google.com/search?q=" +
          encodeURIComponent(query);

      },1000);

    }

    else{

      speak(
        "What should I search for?"
      );

    }

  }


  else if(
    text.includes("who are you") ||
    text.includes("your name")
  ){

    speak(
      "My name is Jarvis. I am your voice assistant."
    );

  }


  else{

    speak(
      "I heard " +
      text +
      ". You can ask me for the time, date, Google or YouTube."
    );

  }

}


/* CHAT BUTTON */

function sendChat(){

  const input =
    document.getElementById("chatInput");

  const text =
    input.value.toLowerCase().trim();


  if(!text){

    speak("Please type something.");

    return;
  }


  input.value = "";


  jarvisCommand(text);

}


/* ENTER KEY */

document
  .getElementById("chatInput")
  .addEventListener("keydown",function(event){

    if(event.key === "Enter"){

      sendChat();

    }

  });


/* STOP */

function stopJarvis(){

  if(recognition){

    try{
      recognition.stop();
    }catch(e){}

  }


  if("speechSynthesis" in window){

    speechSynthesis.cancel();

  }


  s.textContent =
    "⏹️ Jarvis stopped.";

}

</script>

</body>
</html>
